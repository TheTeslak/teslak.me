[build]
command = "pnpm build"
publish = "dist"

[build.environment]
NODE_VERSION = "24"

[[redirects]]
from = "https://www.teslak.me/*"
to = "https://teslak.me/:splat"
status = 301
force = true

[[redirects]]
from = "http://www.teslak.me/*"
to = "https://teslak.me/:splat"
status = 301
force = true

[[redirects]]
from = "http://teslak.me/*"
to = "https://teslak.me/:splat"
status = 301
force = true

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

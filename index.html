<!doctype html>
<!-- 👁 what is essential is invisible to the eye -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Teslak" />
    <meta http-equiv="X-UA-Compatible" content="chrome=1" />
    <meta name="revisit-after" content="7 days" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <title>Teslak Realm · personal blog</title>
    <meta
      name="description"
      content="Curiosity without dogma, testing ideas against reality. Essays, notes, and projects"
    />
    <script>
      ;(function () {
        if (location.pathname === '/' || location.pathname === '/index.html') {
          var match = document.cookie.match(/(?:^|;\s*)site-locale=([^;]*)/)
          var lang = match ? match[1] : (navigator.language || '').slice(0, 2).toLowerCase()
          var supported = ['en', 'ru', 'es', 'pt', 'de', 'fr']
          var target = supported.indexOf(lang) !== -1 ? lang : 'en'
          location.replace('/' + target + location.search + location.hash)
        }
      })()
    </script>
    <script>
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'dark' || (prefersDark && setting !== 'light'))
          document.documentElement.classList.toggle('dark', true)
      })()
    </script>
  </head>
  <body class="font-sans text-gray-700 dark:text-gray-200 relative">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
